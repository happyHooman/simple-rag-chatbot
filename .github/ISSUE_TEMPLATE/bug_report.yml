name: Bug report
description: Something in a lab or the shared code doesn't work
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Which lab or part of the repo?
      placeholder: labs/rag/01-embeddings-similarity
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. uv sync --extra dev
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Remove any API keys or tokens before pasting.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS 15, Python 3.13, uv 0.9
